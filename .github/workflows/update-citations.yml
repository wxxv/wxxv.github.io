name: Update citation stats

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/update_citations.py"
      - ".github/workflows/update-citations.yml"
      - "index.html"

permissions:
  contents: write

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet "scholarly>=1.7.11" "google-search-results>=2.4.2"

      - name: Refresh stats
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python scripts/update_citations.py

      - name: Commit if changed
        id: commit
        run: |
          if git diff --quiet index.html; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No stat changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "chore: auto-refresh Google Scholar stats"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Assemble site
        if: steps.commit.outputs.changed == 'true'
        run: |
          mkdir -p _site/assets/img _site/assets/pdf
          cp index.html .nojekyll robots.txt 404.html _site/
          cp assets/img/xwx.jpg _site/assets/img/xwx.jpg
          cp "assets/pdf/CV_Xu Wenxin.pdf" "_site/assets/pdf/CV_Xu Wenxin.pdf"

      - name: Deploy
        if: steps.commit.outputs.changed == 'true'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
