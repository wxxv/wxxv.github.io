name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-publish
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Assemble site
        run: |
          mkdir -p _site/assets/img _site/assets/pdf
          cp index.html .nojekyll robots.txt 404.html _site/
          cp assets/img/xwx.jpg _site/assets/img/xwx.jpg
          cp "assets/pdf/CV_Xu Wenxin.pdf" "_site/assets/pdf/CV_Xu Wenxin.pdf"

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
          branch: gh-pages
