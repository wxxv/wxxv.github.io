<!doctype html>
<html lang="{{ site.lang | default: 'en' }}" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to main content</a>
    {% include browser-upgrade.html %}
    {% include masthead.html %}

    <main id="main" role="main">
      {% include sidebar.html %}
      <article class="page" itemscope itemtype="https://schema.org/Person">
        <div class="page__inner-wrap">
          <section id="main-content" class="page__content" itemprop="description">
            {{ content }}
          </section>
        </div>
      </article>
    </main>

    {% include scripts.html %}
  </body>
</html>
