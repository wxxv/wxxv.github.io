# Site settings
title: "Wenxin Xu's Homepage"
description: "Ph.D. student at The Hong Kong Polytechnic University researching natural language processing and multimodal learning."
url: "https://wxxv.github.io"
baseurl: ""
repository: "wxxv/wxxv.github.io"
og_image: "/assets/img/og-homepage.png"
lang: "en"
timezone: "Asia/Shanghai"

# Search-engine verification and analytics
google_analytics_id:
google_site_verification:
bing_site_verification:
baidu_site_verification:

# Site author
author:
  name: "Wenxin Xu"
  native_name: "许文鑫"
  avatar: "/assets/img/xwx.jpg"
  bio: "Ph.D. student in PolyU"
  location: "Hong Kong"
  affiliation: "PolyU"
  email: "wenxin.xu.xhzd@gmail.com"
  github: "wxxv"
  googlescholar: "https://scholar.google.com/citations?user=PNCUHp8AAAAJ"
  semanticscholar: "https://www.semanticscholar.org/author/2208594314"
  cv: "/assets/pdf/CV_Xu%20Wenxin.pdf"

# Files and collections
include:
  - _pages
exclude:
  - .devcontainer
  - .github
  - .jekyll-cache
  - .tweet-cache
  - _bibliography
  - _books
  - _news
  - _plugins
  - _posts
  - _projects
  - _scripts
  - bin
  - CONTRIBUTING.md
  - CUSTOMIZE.md
  - Dockerfile
  - FAQ.md
  - INSTALL.md
  - README.md
  - docker-compose.yml
  - docker-compose-slim.yml
  - Gemfile
  - Gemfile.lock
  - lighthouse_results
  - node_modules
  - package.json
  - package-lock.json
  - purgecss.config.js
  - readme_preview
  - requirements.txt
  - vendor
  - _pages/cv.md
  - _pages/news.md
  - _pages/publications.md

# Markdown and layouts
encoding: "utf-8"
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  toc_levels: 1..6

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: academic-homepage
      author_profile: true

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/

plugins:
  - jekyll-feed
  - jekyll-sitemap
